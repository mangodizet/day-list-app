<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>하루정리</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar-drag">하루정리</div>
  <div class="content">
    <div class="date-row">
      <div class="date-nav">
        <button class="nav-arrow" id="prevDayBtn" aria-label="이전 날">‹</button>
        <div class="date-display">
          <div class="today" id="todayLabel"></div>
          <div class="dow" id="dowLabel"></div>
          <input type="date" id="datePicker" class="date-picker-input" aria-label="날짜 선택" />
        </div>
        <button class="nav-arrow" id="nextDayBtn" aria-label="다음 날">›</button>
      </div>
      <div class="header-links">
        <button class="history-link" id="todayJumpBtn" style="display:none">오늘로</button>
        <button class="history-link" id="miniModeBtn" title="트레이로 숨기고 미니 요약창 보기">미니 모드</button>
        <span class="app-version" id="appVersion"></span>
        <button class="icon-btn cal-btn" id="calendarBtn" title="달력 보기" aria-label="달력 보기">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
          </svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="설정">⚙</button>
      </div>
    </div>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0/0 완료</div>
    </div>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="할 일을 입력하고 Enter" maxlength="80" />
      <button id="addBtn">추가</button>
    </div>

    <div class="cat-title">하루 할 일</div>
    <ul class="list" id="list"></ul>

    <section class="lt-section">
      <div class="lt-head">
        <span class="cat-title">장기 일정</span>
        <button class="lt-add-btn" id="ltAddBtn">+ 장기 일정 추가</button>
      </div>
      <ul class="lt-list" id="ltList"></ul>
    </section>
  </div>

  <div class="footer">
    <div class="hint" id="footerHint">미완료 항목이 없어요</div>
    <button class="carry-btn" id="carryBtn">다음날로 이월하기</button>
  </div>

  <!-- 이월 확인 모달 (날짜가 바뀌었을 때) -->
  <div class="modal-layer" id="rolloverModalLayer">
    <div class="modal wide">
      <div class="icon">!</div>
      <h2 id="rolloverTitle"></h2>
      <ul class="rollover-list" id="rolloverList"></ul>
      <div class="sub">이 항목들을 오늘로 이월할까요?</div>
      <div class="modal-actions">
        <button id="rolloverNo">아니요</button>
        <button class="primary" id="rolloverYes">예</button>
      </div>
    </div>
  </div>

  <!-- 업데이트 발견 모달 -->
  <div class="modal-layer" id="updateModalLayer">
    <div class="modal wide">
      <div class="icon">↑</div>
      <h2 id="updateModalTitle"></h2>
      <div class="update-notes" id="updateModalNotes"></div>
      <div class="sub" id="updateModalSub">지금 업데이트할까요?</div>
      <div class="modal-actions">
        <button id="updateLaterBtn">나중에</button>
        <button class="primary" id="updateInstallBtn">업데이트하기</button>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-layer" id="settingsModalLayer">
    <div class="modal">
      <button class="close-btn" id="settingsCloseBtn">×</button>
      <h2>설정</h2>
      <label class="setting-row">
        <input type="checkbox" id="autoLaunchCheckbox" />
        <span>Windows 시작 시 자동 실행</span>
      </label>
      <div class="setting-row update-row">
        <button id="checkUpdateBtn">업데이트 확인</button>
        <span id="updateStatus" class="update-status"></span>
      </div>
    </div>
  </div>

  <!-- 장기 일정 추가 모달 -->
  <div class="modal-layer" id="ltModalLayer">
    <div class="modal">
      <button class="close-btn" id="ltCloseBtn">×</button>
      <h2>장기 일정 추가</h2>
      <label class="field">
        <span>어떤 일정인가요?</span>
        <input type="text" id="ltText" maxlength="80" placeholder="예: 포트폴리오 정리" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>시작일</span>
          <input type="date" id="ltStart" />
        </label>
        <label class="field">
          <span>종료일</span>
          <input type="date" id="ltEnd" />
        </label>
      </div>
      <div class="field-error" id="ltError"></div>
      <div class="modal-actions">
        <button id="ltCancelBtn">취소</button>
        <button class="primary" id="ltSaveBtn">추가</button>
      </div>
    </div>
  </div>

  <!-- 달력 모달 -->
  <div class="modal-layer" id="calModalLayer">
    <div class="modal cal-modal">
      <button class="close-btn" id="calCloseBtn">×</button>
      <div class="cal-head">
        <button class="nav-arrow" id="calPrevBtn" aria-label="이전 달">‹</button>
        <h2 id="calTitle"></h2>
        <button class="nav-arrow" id="calNextBtn" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid cal-dow">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i class="lg lg-lt"></i>장기 일정</span>
        <span><i class="lg lg-over"></i>기간 지나 이월 중</span>
        <span><b>2/3</b> 하루 할 일 완료</span>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
