<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>하루정리 - 미니</title>
<link rel="stylesheet" href="mini.css" />
</head>
<body>
  <div class="mini-card">
    <div class="mini-header">
      <span class="mini-date" id="miniDateLabel"></span>
      <div class="mini-header-actions">
        <button class="mini-icon-btn" id="miniCalBtn" title="달력 보기" aria-label="달력 보기">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
          </svg>
        </button>
        <button class="mini-icon-btn" id="miniPinBtn" title="항상 위에 표시">📌</button>
        <button class="mini-icon-btn" id="miniCloseBtn" title="메인 창으로 돌아가기">×</button>
      </div>
    </div>
    <ul class="mini-list" id="miniList"></ul>
    <div class="mini-cal" id="miniCal" hidden>
      <div class="mini-cal-head">
        <button class="mini-icon-btn" id="miniCalPrev" aria-label="이전 달">‹</button>
        <span id="miniCalTitle"></span>
        <button class="mini-icon-btn" id="miniCalNext" aria-label="다음 달">›</button>
      </div>
      <div class="mini-cal-grid mini-cal-dow">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="mini-cal-grid" id="miniCalGrid"></div>
      <div class="mini-cal-day-title" id="miniCalDayTitle"></div>
      <ul class="mini-cal-day-list" id="miniCalDayList"></ul>
    </div>
    <div class="mini-footer">
      <span class="mini-progress" id="miniProgress"></span>
      <div class="mini-opacity">
        <span>투명도</span>
        <input type="range" id="miniOpacityRange" min="30" max="100" value="92" />
        <span class="mini-opacity-value" id="miniOpacityValue">92%</span>
      </div>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="mini.js"></script>
</body>
</html>
